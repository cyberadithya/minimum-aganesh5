image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo 1234567890123456\necho ok\n"

[assert]
uart0_contains = "msh> msh: line too long (max 20 bytes)\nmsh> ok\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
