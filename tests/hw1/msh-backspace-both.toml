image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo abx\u0008c\necho abx\u007Fd\n"

[assert]
uart0_contains = "msh> abc\nmsh> abd\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
