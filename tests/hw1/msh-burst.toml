image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 4000000

[[inputs]]
at_tick = 300000
uart = 0
data = "\necho still ok\n"

[assert]
uart0_contains = "msh> msh: line too long (max 20 bytes)\nmsh> still ok\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
